name: Photo Variants

# Resizes uploaded gallery photos into 3600/2048/1024/640 JPEGs (Phase 5.2),
# then makes a web copy + poster frame of any new gallery videos (Phase 6).
# Runs here rather than in the Worker so this never burns Worker CPU, and it's
# free (no Cloudflare Stream).
# Like backup.yml, the schedule and the manual button only work once this file
# is on the default branch (main).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  variants:
    # Staging runs develop's code with the staging environment's secrets;
    # production runs main's code with the production environment's secrets
    # (launch task 21). The production run skips itself until production is
    # set up: every one of its secrets must be set ON the production
    # environment, and main must hold the app (it does from go-live).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            ref: develop
          - target: production
            ref: main
    runs-on: ubuntu-latest
    environment: ${{ matrix.target }}
    # Two overlapping runs on one target would resize the same photos twice.
    concurrency:
      group: photo-variants-${{ matrix.target }}
      cancel-in-progress: false
    # Long enough for a few long films; the job takes at most 3 videos a run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - id: gate
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: ${{ secrets.R2_MEDIA_BUCKET }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SERVICE_KEY" ] && [ -n "$BUCKET" ] && [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.target }} isn't set up yet (secrets or app code missing); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        run: npm run variants
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Media-bucket credentials, separate from the backups token
          # (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY repo secrets).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_MEDIA_BUCKET }}
      # Videos: only install ffmpeg when there's something to encode, so the
      # hourly run stays quick when nothing new has been uploaded. They run
      # even if a photo failed above.
      - id: videos
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' }}
        run: npm run video-web -- --check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_MEDIA_BUCKET }}
      - if: ${{ !cancelled() && steps.videos.outputs.pending == 'true' }}
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - if: ${{ !cancelled() && steps.videos.outputs.pending == 'true' }}
        run: npm run video-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_MEDIA_BUCKET }}
