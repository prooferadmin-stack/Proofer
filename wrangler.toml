# Production Worker (deployed from `main`).
name = "proofer"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
# worker.mjs wraps the OpenNext build output (.open-next/worker.js) and adds
# the reminder cron handler (Phase 8.3).
main = "worker.mjs"

# Static assets emitted by the OpenNext build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Production reminder queue (Phase 8.3), hourly at :05 UTC, same as staging.
# Harmless until production has its database and secrets (launch/prod-setup.md).
[triggers]
crons = ["5 * * * *"]

# Public base URL for links in Stripe redirects and emails. Not a secret.
# The client-facing address David picked 2026-10-31.
[vars]
APP_BASE_URL = "https://studio.davidmonroephotos.com"

# Staging Worker (deployed from `develop`). Run with --env staging.
[env.staging]
name = "proofer-staging"

[env.staging.assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Public base URL for links in Stripe redirects and emails. Not a secret.
[env.staging.vars]
APP_BASE_URL = "https://proofer-staging.proofer.workers.dev"

# Reminder queue (Phase 8.3), hourly at :05 UTC. Reminders are due at 10:00
# Eastern, so they go out within the hour. Production has its own [triggers] at the top.
[env.staging.triggers]
crons = ["5 * * * *"]

# No R2 binding: galleries (Phase 5) need presigned URLs so media goes
# browser <-> R2 directly, which needs the S3-compatible API with access keys
# (r2.ts + the R2_* secrets below), not a binding.

# Secrets are set via the Cloudflare dashboard or `wrangler secret put`, never here:
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_BASE_URL,
# RESEND_API_KEY, RESEND_FROM_EMAIL, RESEND_REPLY_TO, RESEND_WEBHOOK_SECRET, NEXT_PUBLIC_SENTRY_DSN, APP_BASE_URL
